<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="junkanoo" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="200" height="200" fill="#faf8f5"/>
      
      <!-- Layer 1: Large zigzag chevrons - Junkanoo signature -->
      <path d="M0 20 L20 40 L40 20 L60 40 L80 20 L100 40 L120 20 L140 40 L160 20 L180 40 L200 20 L200 0 L0 0 Z" fill="#7a1a2e" opacity="0.12"/>
      <path d="M0 25 L20 45 L40 25 L60 45 L80 25 L100 45 L120 25 L140 45 L160 25 L180 45 L200 25 L200 5 L0 5 Z" fill="#9a2a3e" opacity="0.08"/>
      
      <!-- Layer 2: Caribbean triangles - reef formations -->
      <polygon points="30,50 50,80 10,80" fill="#4a9a8a" opacity="0.15"/>
      <polygon points="90,50 110,80 70,80" fill="#4a9a8a" opacity="0.15"/>
      <polygon points="150,50 170,80 130,80" fill="#4a9a8a" opacity="0.15"/>
      
      <!-- Layer 3: Gold diamonds - Junkanoo motifs -->
      <polygon points="60,65 80,85 60,105 40,85" fill="#9a7520" opacity="0.18"/>
      <polygon points="140,65 160,85 140,105 120,85" fill="#9a7520" opacity="0.18"/>
      
      <!-- Layer 4: Coral clusters - organic shapes -->
      <circle cx="20" cy="95" r="12" fill="#d4705a" opacity="0.12"/>
      <circle cx="100" cy="95" r="15" fill="#d4705a" opacity="0.12"/>
      <circle cx="180" cy="95" r="12" fill="#d4705a" opacity="0.12"/>
      
      <!-- Layer 5: Wave pattern - ocean reference -->
      <path d="M0 110 Q25 100 50 110 Q75 120 100 110 Q125 100 150 110 Q175 120 200 110 L200 130 Q175 120 150 130 Q125 140 100 130 Q75 120 50 130 Q25 140 0 130 Z" fill="#5aa0b0" opacity="0.14"/>
      
      <!-- Layer 6: Small triangles - geometric accents -->
      <polygon points="10,140 20,155 0,155" fill="#7a1a2e" opacity="0.1"/>
      <polygon points="50,140 60,155 40,155" fill="#7a1a2e" opacity="0.1"/>
      <polygon points="90,140 100,155 80,155" fill="#7a1a2e" opacity="0.1"/>
      <polygon points="130,140 140,155 120,155" fill="#7a1a2e" opacity="0.1"/>
      <polygon points="170,140 180,155 160,155" fill="#7a1a2e" opacity="0.1"/>
      
      <!-- Layer 7: Bottom chevrons - Junkanoo border -->
      <path d="M0 160 L20 175 L40 160 L60 175 L80 160 L100 175 L120 160 L140 175 L160 160 L180 175 L200 160 L200 200 L0 200 Z" fill="#9a7520" opacity="0.15"/>
      <path d="M0 165 L20 180 L40 165 L60 180 L80 165 L100 180 L120 165 L140 180 L160 165 L180 180 L200 165 L200 200 L0 200 Z" fill="#b89040" opacity="0.1"/>
      
      <!-- Layer 8: Dot accents - coral polyps -->
      <circle cx="10" cy="10" r="3" fill="#d4705a" opacity="0.25"/>
      <circle cx="50" cy="30" r="2" fill="#4a9a8a" opacity="0.25"/>
      <circle cx="90" cy="10" r="3" fill="#9a7520" opacity="0.25"/>
      <circle cx="130" cy="30" r="2" fill="#7a1a2e" opacity="0.2"/>
      <circle cx="170" cy="10" r="3" fill="#5aa0b0" opacity="0.25"/>
      <circle cx="30" cy="120" r="2.5" fill="#d4705a" opacity="0.2"/>
      <circle cx="70" cy="100" r="2" fill="#4a9a8a" opacity="0.25"/>
      <circle cx="110" cy="120" r="2.5" fill="#9a7520" opacity="0.2"/>
      <circle cx="150" cy="100" r="2" fill="#7a1a2e" opacity="0.25"/>
      <circle cx="190" cy="120" r="2.5" fill="#5aa0b0" opacity="0.2"/>
      <circle cx="20" cy="185" r="2" fill="#d4705a" opacity="0.2"/>
      <circle cx="60" cy="190" r="2.5" fill="#4a9a8a" opacity="0.2"/>
      <circle cx="100" cy="185" r="2" fill="#9a7520" opacity="0.2"/>
      <circle cx="140" cy="190" r="2.5" fill="#7a1a2e" opacity="0.2"/>
      <circle cx="180" cy="185" r="2" fill="#5aa0b0" opacity="0.2"/>
      
      <!-- Layer 9: Small diamonds - Junkanoo sparkle -->
      <polygon points="45,45 50,50 45,55 40,50" fill="#9a7520" opacity="0.2"/>
      <polygon points="105,25 110,30 105,35 100,30" fill="#7a1a2e" opacity="0.18"/>
      <polygon points="165,45 170,50 165,55 160,50" fill="#4a9a8a" opacity="0.2"/>
      <polygon points="25,150 30,155 25,160 20,155" fill="#d4705a" opacity="0.18"/>
      <polygon points="85,150 90,155 85,160 80,155" fill="#9a7520" opacity="0.2"/>
      <polygon points="145,150 150,155 145,160 140,155" fill="#5aa0b0" opacity="0.18"/>
      
      <!-- Layer 10: Cross accents - Caribbean motif -->
      <g opacity="0.15">
        <line x1="40" y1="25" x2="40" y2="35" stroke="#7a1a2e" stroke-width="1.5"/>
        <line x1="35" y1="30" x2="45" y2="30" stroke="#7a1a2e" stroke-width="1.5"/>
      </g>
      <g opacity="0.15">
        <line x1="120" y1="25" x2="120" y2="35" stroke="#4a9a8a" stroke-width="1.5"/>
        <line x1="115" y1="30" x2="125" y2="30" stroke="#4a9a8a" stroke-width="1.5"/>
      </g>
      <g opacity="0.15">
        <line x1="80" y1="170" x2="80" y2="180" stroke="#9a7520" stroke-width="1.5"/>
        <line x1="75" y1="175" x2="85" y2="175" stroke="#9a7520" stroke-width="1.5"/>
      </g>
      <g opacity="0.15">
        <line x1="160" y1="170" x2="160" y2="180" stroke="#d4705a" stroke-width="1.5"/>
        <line x1="155" y1="175" x2="165" y2="175" stroke="#d4705a" stroke-width="1.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#junkanoo)"/>
</svg>