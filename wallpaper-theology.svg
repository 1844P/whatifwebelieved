<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="junkanoo" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Background -->
      <rect width="120" height="120" fill="#faf8f5"/>
      
      <!-- Coral reef zigzag rows - top -->
      <path d="M0 10 L15 25 L30 10 L45 25 L60 10 L75 25 L90 10 L105 25 L120 10 L120 0 L0 0 Z" fill="#e8a08a" opacity="0.15"/>
      
      <!-- Teal triangles - Caribbean water -->
      <polygon points="15,30 30,50 0,50" fill="#4a9a8a" opacity="0.12"/>
      <polygon points="75,30 90,50 60,50" fill="#4a9a8a" opacity="0.12"/>
      
      <!-- Gold diamond - Junkanoo motif -->
      <polygon points="45,35 60,50 45,65 30,50" fill="#c8a24e" opacity="0.1"/>
      
      <!-- Coral hexagon clusters - reef inspired -->
      <polygon points="90,35 105,50 90,65 75,50" fill="#d4705a" opacity="0.1"/>
      
      <!-- Small triangles - geometric accent -->
      <polygon points="10,60 20,75 0,75" fill="#7a1a2e" opacity="0.08"/>
      <polygon points="50,60 60,75 40,75" fill="#7a1a2e" opacity="0.08"/>
      <polygon points="100,60 110,75 90,75" fill="#7a1a2e" opacity="0.08"/>
      
      <!-- Wave pattern - ocean reference -->
      <path d="M0 80 Q15 70 30 80 Q45 90 60 80 Q75 70 90 80 Q105 90 120 80 L120 95 Q105 85 90 95 Q75 105 60 95 Q45 85 30 95 Q15 105 0 95 Z" fill="#5aa0b0" opacity="0.1"/>
      
      <!-- Bottom chevron - Junkanoo signature -->
      <path d="M0 100 L15 110 L30 100 L45 110 L60 100 L75 110 L90 100 L105 110 L120 100 L120 120 L0 120 Z" fill="#c8a24e" opacity="0.12"/>
      
      <!-- Dot accents - coral polyps -->
      <circle cx="15" cy="15" r="2" fill="#d4705a" opacity="0.2"/>
      <circle cx="45" cy="45" r="1.5" fill="#4a9a8a" opacity="0.2"/>
      <circle cx="75" cy="15" r="2" fill="#c8a24e" opacity="0.2"/>
      <circle cx="105" cy="45" r="1.5" fill="#7a1a2e" opacity="0.15"/>
      <circle cx="30" cy="75" r="2" fill="#5aa0b0" opacity="0.2"/>
      <circle cx="60" cy="105" r="1.5" fill="#d4705a" opacity="0.2"/>
      <circle cx="90" cy="75" r="2" fill="#4a9a8a" opacity="0.2"/>
      
      <!-- Small diamonds - Junkanoo sparkle -->
      <polygon points="25,90 30,95 25,100 20,95" fill="#c8a24e" opacity="0.15"/>
      <polygon points="65,20 70,25 65,30 60,25" fill="#7a1a2e" opacity="0.12"/>
      <polygon points="105,85 110,90 105,95 100,90" fill="#4a9a8a" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#junkanoo)"/>
</svg>